name: Auto release

# Every push to main is a build release. The job appends a version-bump commit
# ("Release bN (1.N.0)") that sets every workspace package to 1.N.0 in lockstep
# and moves each CHANGELOG's [Unreleased] section to [1.N.0] - date
# (scripts/bump-build-versions.mjs), then tags that commit bN. N is the bump
# commit's own position on main (`git rev-list --count` after appending it), so
# package version, tag, and the build name `toucan --version` derives from the
# checkout all agree on one number.
#
# This job does not create the GitHub release: build-binaries.yml stages it as a
# draft with the release notes and the platform assets, then publishes it. A
# release created here would already be public, and staging refuses to mutate a
# published release.
#
# The bump is pushed with the workflow token, which cannot trigger any workflow
# run, not even on a `b*` tag. So after pushing the tag, this job dispatches
# the release pipelines itself (build-binaries.yml for the release assets,
# nix.yml for the stable branch). The tag drives the stable channel:
# `install.sh stable` and `toucan install toucan:stable` resolve the highest
# `b<N>` tag.

on:
  push:
    branches: [main]

permissions:
  contents: write
  # To dispatch the release pipelines (gh workflow run) after the token push.
  actions: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bump, tag, and release this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git log -1 --format=%s | grep -q '^Release b[0-9][0-9]*'; then
            # Re-run safety: HEAD is already the bump commit of a failed earlier run.
            N="$(git rev-list --count HEAD)"
          else
            N=$(( $(git rev-list --count HEAD) + 1 ))
            if git ls-remote --exit-code --tags origin "refs/tags/b$N" >/dev/null 2>&1; then
              echo "b$N already exists but HEAD is not its release commit (rewritten history?); leaving it alone." >&2
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            node scripts/bump-build-versions.mjs "$N"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            node scripts/generate-coding-agent-install-lock.mjs
            git add package-lock.json packages apps
            git commit -m "Release b${N} (1.${N}.0)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

          TAG="b$N"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            # Covers a re-run whose earlier attempt died between pushing the commit and the tag.
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

          # The token push above cannot trigger workflows, so start the release
          # pipelines explicitly. Dispatching a workflow that also runs on this
          # event is safe: the runs would be redundant but concurrency groups merge them.
          gh workflow run build-binaries.yml --ref "${{ github.ref_name }}" -f "tag=$TAG" -f "source_ref=$TAG"
          gh workflow run nix.yml --ref "$TAG"
